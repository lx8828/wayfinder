[project]
name = "first-agent"
version = "0.2.0.dev0"
description = "Weather & travel assistant on a from-scratch Tool Agent Runtime (ReAct + Plan-Execute + memory + eval gates)"
readme = "README.md"
authors = [
    { name = "lx", email = "834659376@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "flask>=3.0.0",
    "pyngrok>=7.1.0",
    "tzdata>=2024.1",
]

[project.scripts]
first-agent = "first_agent.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
